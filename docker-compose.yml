# docker-compose.yml — local development only
# This is NOT used in production (Railway handles that)

services:

  node-api:
    build: ./node-api
    ports:
      - "3000:3000"
    env_file:
      - ./node-api/.env
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://user:pass@postgres:5432/tickets
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PYTHON_SERVICE_URL: http://python-agent:8000
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - postgres
      - redis
      - python-agent

  python-agent:
    build: ./python-agent
    ports:
      - "8000:8000"
    env_file:
      - ./python-agent/.env
    environment:
      PORT: 8000
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./node-api/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
